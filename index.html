<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FlightRadar v17.0</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
  html, body { margin:0; height:100%; background:#000; font-family: 'Share Tech Mono', monospace; color: #00ffcc; overflow: hidden; }
  #map { width:100%; height:100%; background: #000; }
  
  #hud { 
    position: absolute; top: 10px; left: 10px; right: 10px; max-width: 480px;
    background: rgba(5, 10, 15, 0.95); border: 1px solid #00ffcc; 
    padding: 12px; z-index: 1000; pointer-events: auto;
  }
  
  .filter-row { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
  .tgl-btn { flex: 1; min-width: 90px; background: rgba(0, 255, 204, 0.1); border: 1px solid #00ffcc; color: #00ffcc; font-size: 10px; padding: 6px; cursor: pointer; text-align: center; user-select: none; }
  .tgl-btn.active { background: #00ffcc; color: #000; font-weight: bold; }
  .refresh-btn { background: #ffcc00 !important; color: #000 !important; border: 1px solid #ffcc00 !important; font-weight: bold; }

  /* Leaflet Pop-up Overrides */
  .leaflet-popup-content-wrapper { background: #ffffff !important; color: #000 !important; border-radius: 0px; border: 2px solid #333; padding: 0; overflow: hidden; }
  .leaflet-popup-content { margin: 0 !important; width: 280px !important; }
  .leaflet-popup-tip { background: #fff !important; }
  
  .img-frame { background: #111; position: relative; width: 100%; height: 150px; border-bottom: 2px solid #333; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  
  .ac-photo { 
    position: absolute; 
    top: 0; 
    left: 0; 
    z-index: 2; 
    width: 100%; 
    height: 100%; 
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
  }
  
  .no-img-label { color: #00ffcc; font-size: 10px; z-index: 1; letter-spacing: 1px; font-weight: bold; text-align: center; }

  .intel-body { padding: 12px; background: #fff; }
  .mil-banner { background: #d32f2f; color: #fff; padding: 4px; font-weight: bold; text-align: center; font-size: 10px; letter-spacing: 1px; }
  .intel-row { border-bottom: 1px solid #eee; padding: 5px 0; display: flex; justify-content: space-between; font-size: 12px; font-family: 'Share Tech Mono', monospace; }
  .intel-row b { color: #555; }
  .intel-row span { color: #000; font-weight: bold; text-align: right; max-width: 65%; }
</style>
</head>
<body>

<div id="hud">
  <div style="font-size: 18px; font-weight: bold; letter-spacing: 2px;">🛰️ STRATCOM v17.0</div>
  <div id="hud-intel" style="font-size: 11px; color: #00ffcc; letter-spacing: 1px;">INTEL: INITIALIZING RADAR MATRIX...</div>
  
  <div class="filter-row">
    <div id="f-mil" class="tgl-btn" onclick="toggleFilter('mil')">MILITARY / GOV</div>
    <div id="f-heli" class="tgl-btn" onclick="toggleFilter('heli')">ROTORS</div>
    <div id="f-infra" class="tgl-btn active" onclick="toggleFilter('infra')">INFRA</div>
    <div id="scan-btn" class="tgl-btn refresh-btn" onclick="scrapeRadar()">SCAN AREA</div>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const WORKER_URL = "https://adsb-bridge.lezattackpenguinskindig.workers.dev/";

let map, flightLayers, infraLayers, nexradLayer;
let isUpdating = false;
const filters = { mil: false, heli: false, infra: true };

// Format Aircraft Types from ICAO codes + DB Description Fallback
function formatAircraftType(typeCode, desc) {
    const types = {
        'B738': 'Boeing 737-800', 'B737': 'Boeing 737', 'B739': 'Boeing 737-900',
        'A320': 'Airbus A320', 'A321': 'Airbus A321', 'A319': 'Airbus A319',
        'B77W': 'Boeing 777-300ER', 'B788': 'Boeing 787-8', 'B789': 'Boeing 787-9',
        'C17': 'Boeing C-17 Globemaster III', 'C130': 'Lockheed C-130 Hercules',
        'K35R': 'Boeing KC-135 Stratotanker', 'H60': 'UH-60 Black Hawk',
        'B52': 'Boeing B-52 Stratofortress', 'F35': 'Lockheed F-35 Lightning II',
        'A10': 'Fairchild Republic A-10 Thunderbolt II', 'P8': 'Boeing P-8 Poseidon'
    };
    return types[typeCode] || desc || typeCode || 'Unknown';
}

function formatCategory(cat) {
    if (!cat) return 'Unknown';
    const cats = {
        'A1': 'Light', 'A2': 'Small', 'A3': 'Large (Airliner)',
        'A4': 'High Vortex Large', 'A5': 'Heavy', 'A6': 'High Performance', 'A7': 'Rotorcraft'
    };
    return cats[cat] || cat;
}

// Decode Military Branch via DB Registry, Callsign, Hex, or Airframe Inference
function getMilitaryBranch(ac) {
    const cs = (ac.flight || '').trim().toUpperCase();
    const hx = (ac.hex || '').toUpperCase();
    const op = (ac.ownOp || '').toUpperCase();
    const type = (ac.t || '').toUpperCase();

    // 1. Check ADS-B Live Registry (Owner/Operator Database)
    if (op.includes('AIR FORCE') || op.includes('USAF')) return 'US AIR FORCE';
    if (op.includes('NAVY') || op.includes('USN')) return 'US NAVY';
    if (op.includes('MARINE') || op.includes('USMC')) return 'US MARINE CORPS';
    if (op.includes('ARMY')) return 'US ARMY';
    if (op.includes('COAST GUARD') || op.includes('USCG')) return 'US COAST GUARD';
    if (op.includes('CUSTOMS') || op.includes('CBP')) return 'US CUSTOMS & BORDER PATROL';
    if (op.includes('ROYAL AIR FORCE')) return 'ROYAL AIR FORCE (UK)';
    if (op.includes('CANADIAN ARMED FORCES')) return 'ROYAL CANADIAN AIR FORCE';

    // 2. Civil-Registered DoD Contractors
    if (cs.startsWith('JANET')) return 'USAF CONTRACTOR (JANET)';
    if (cs.startsWith('OMEGA')) return 'DOD REFUELING CONTRACTOR (OMEGA)';
    if (cs.startsWith('ATAC') || cs.startsWith('DRAKEN') || cs.startsWith('DRK') || cs.startsWith('BDR') || cs.startsWith('META') || cs.startsWith('VADER')) return 'DOD ADVERSARY CONTRACTOR';

    // 3. International Checks via Hex / Callsign
    if (hx.startsWith('43C') || cs.startsWith('RRR') || cs.startsWith('ASY') || cs.startsWith('VORTEX')) return 'ROYAL AIR FORCE (UK)';
    if (cs.startsWith('CFC') || cs.startsWith('CAN')) return 'ROYAL CANADIAN AIR FORCE';
    
    // 4. US Tactical Callsign Matrix
    // Added 'HIVE' here:
    const usafCallsigns = ['RCH', 'REACH', 'SPAR', 'AF', 'MOOSE', 'BONE', 'QID', 'HOBO', 'JESSE', 'HUSKY', 'KING', 'SHADOW', 'TIGER', 'VIPER', 'SNOOPY', 'GHOST', 'BAT', 'DEATH', 'THUG', 'SLAM', 'JEDI', 'HIVE'];
    
    if (usafCallsigns.some(prefix => cs.startsWith(prefix))) return 'US AIR FORCE';
    
    if (cs.startsWith('NAVY') || cs.startsWith('VV') || cs.startsWith('CNV') || cs.startsWith('LANCE') || cs.startsWith('TRIDENT') || cs.startsWith('TALON')) return 'US NAVY';
    if (cs.startsWith('VM') || cs.startsWith('USMC') || cs.startsWith('RAIDER') || cs.startsWith('OTIS') || cs.startsWith('WARLORD')) return 'US MARINE CORPS';
    if (cs.startsWith('PAT') || cs.startsWith('GUARD') || cs.startsWith('ARMY') || cs.startsWith('DUSTOFF') || cs.startsWith('DUKE')) return 'US ARMY';
    if (cs.startsWith('CG') || cs.startsWith('COAST') || (cs.startsWith('C') && cs.length === 5 && !isNaN(cs.substring(1)))) return 'US COAST GUARD';

    // 5. Hex + Airframe Inference
    if (hx.startsWith('AE')) {
        if (['C17', 'K35R', 'B52', 'B1', 'B2', 'A10', 'F16', 'F22', 'F35', 'C130', 'C5'].includes(type)) return 'US AIR FORCE (INFERRED)';
        if (['P8', 'E6'].includes(type)) return 'US NAVY (INFERRED)';
        return 'US ARMED FORCES';
    }
    
    return 'GOV / MILITARY ASSET (UNSPECIFIED)';
}


function toggleFilter(type) {
    filters[type] = !filters[type];
    document.getElementById(`f-${type}`).classList.toggle('active');
    if(type === 'infra') {
        if(filters[type]) infraLayers.addTo(map); else map.removeLayer(infraLayers);
    }
    scrapeRadar();
}

function initMap() {
    const darkMap = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 });
    const satHD = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });

    map = L.map('map', { zoomControl: false, layers: [darkMap] }).setView([32.8, -79.9], 6);
    
    const hudElement = document.getElementById('hud');
    L.DomEvent.disableClickPropagation(hudElement);
    L.DomEvent.disableScrollPropagation(hudElement);

    flightLayers = L.layerGroup().addTo(map);
    infraLayers = L.layerGroup().addTo(map);

    nexradLayer = L.tileLayer.wms("https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0r.cgi", {
        layers: 'nexrad-n0r-900913',
        format: 'image/png',
        transparent: true,
        version: '1.1.1',
        opacity: 0.35,
        zIndex: 500
    }).addTo(map);

    L.control.layers({
        "Tactical Dark": darkMap, 
        "Satellite": satHD
    }, {
        "NEXRAD Weather": nexradLayer,
        "Infrastructure": infraLayers
    }, { collapsed: true }).addTo(map);

    loadInfrastructure();
    scrapeRadar();
    
    setInterval(scrapeRadar, 30000);
    map.on('moveend', () => { scrapeRadar(); });
}

function loadInfrastructure() {
    const locs = [
        { n: "KCHS: JB Charleston", c: [32.89, -80.04], m:1 },
        { n: "KJFK: New York JFK", c: [40.64, -73.77], m:0 },
        { n: "KSNA: John Wayne", c: [33.67, -117.86], m:0 },
        { n: "KDCA: Reagan National", c: [38.85, -77.03], m:0 },
        { n: "KJB-MC: JB Lewis-McChord", c: [47.13, -122.48], m:1 },
        { n: "EGLL: London Heathrow", c: [51.47, -0.45], m:0 },
        { n: "YSSY: Sydney Kingsford Smith", c: [-33.93, 151.17], m:0 },
        { n: "RODN: Kadena AB (JP)", c: [26.35, 127.76], m:1 }
    ];
    locs.forEach(l => {
        L.circleMarker(l.c, { radius: 6, color: l.m ? '#f33':'#0af', weight: 2, fillOpacity: 0.3 }).bindPopup(`<b>${l.n}</b>`).addTo(infraLayers);
    });
}

async function scrapeRadar() {
    if(isUpdating) return;
    isUpdating = true;
    
    const scanBtn = document.getElementById('scan-btn');
    const intelLabel = document.getElementById('hud-intel');
    if(scanBtn) scanBtn.innerText = "⚡ SCANNING...";
    if(intelLabel) intelLabel.innerText = "INTEL: CONNECTING TO SATELLITE UPLINK...";
    
    const c = map.getCenter();
    const url = `${WORKER_URL}?url=${encodeURIComponent(`https://api.adsb.lol/v2/lat/${c.lat.toFixed(4)}/lon/${c.lng.toFixed(4)}/dist/250`)}&_t=${Date.now()}`;

    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP Error Status: ${res.status}`);
        
        const data = await res.json();
        const acs = data.ac || [];
        
        flightLayers.clearLayers();
        let renderedCount = 0;

        acs.forEach(ac => {
            if (!ac.lat || !ac.lon) return;
            
            const hex = (ac.hex || '').toUpperCase();
            const flightCode = (ac.flight || '').trim().toUpperCase();
            
            const isContractor = flightCode.startsWith('JANET') || flightCode.startsWith('OMEGA') || flightCode.startsWith('ATAC') || flightCode.startsWith('DRAKEN') || flightCode.startsWith('DRK') || flightCode.startsWith('BDR') || flightCode.startsWith('META') || flightCode.startsWith('VADER');
            
            const isMil = ac.mil === 1 || (ac.dbFlags && (ac.dbFlags & 1) === 1) || hex.startsWith('AE') || hex.startsWith('43C') || isContractor;
            const isHeli = (ac.t && (ac.t.includes('H6') || ac.t.includes('EC') || ac.t.includes('B06'))) || ac.category === 'A7';
            
            if (filters.mil && !isMil) return;
            if (filters.heli && !isHeli) return;

            renderedCount++;
            let color = isMil ? '#f33' : (isHeli ? '#fc0' : '#0fc');
            
            const jetPath = "M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z";
            const heliPath = "M12 2v2h8v2h-8v3h4v2h-4v7h-2v-7H8v-2h4V7H4V5h8V2h2z";
            const chosenPath = isHeli ? heliPath : jetPath;

            const marker = L.marker([ac.lat, ac.lon], { 
                icon: L.divIcon({ 
                    html: `<div style="transform: rotate(${ac.track || 0}deg); width:24px; height:24px;"><svg viewBox="0 0 24 24" width="24" height="24"><path fill="${color}" d="${chosenPath}"/></svg></div>`,
                    className: 'ac-icon', 
                    iconSize: [24, 24],
                    iconAnchor: [12, 12], 
                    popupAnchor: [0, -10] 
                }) 
            });

            const headingDisplay = (ac.track !== undefined && ac.track !== null) ? Math.round(ac.track).toString().padStart(3, '0') + '°' : '---';

            // Pass the entire `ac` object to the branch detector to read the registry data
            const branchRow = isMil ? `<div class="intel-row"><b>Operator:</b> <span style="color: #d32f2f;">${getMilitaryBranch(ac)}</span></div>` : '';

            marker.bindPopup(`
                <div class="popup-intel">
                    <div class="img-frame">
                        <div class="no-img-label status-label">FETCHING DATABASE...</div>
                        <img class="ac-photo fetch-img" src="" style="opacity: 0;" referrerpolicy="no-referrer" crossorigin="anonymous">
                    </div>
                    ${isMil ? '<div class="mil-banner">MILITARY / GOV ASSET</div>' : ''}
                    <div class="intel-body" style="font-family: 'Share Tech Mono', monospace; font-size: 13px;">
                        ${branchRow}
                        <div class="intel-row"><b>Aircraft:</b> <span>${formatAircraftType(ac.t, ac.desc)}</span></div>
                        <div class="intel-row"><b>Category:</b> <span>${formatCategory(ac.category)}</span></div>
                        <div class="intel-row"><b>Callsign:</b> <span>${(ac.flight || '---').trim()}</span></div>
                        <div class="intel-row"><b>Altitude:</b> <span>${ac.alt_baro ? ac.alt_baro.toLocaleString() + ' ft' : '---'}</span></div>
                        <div class="intel-row"><b>Speed:</b> <span>${Math.round(ac.gs || 0)} kts</span></div>
                        <div class="intel-row"><b>Heading:</b> <span>${headingDisplay}</span></div>
                    </div>
                </div>
            `);

            marker.on('popupopen', (e) => {
                const popupNode = e.popup.getElement();
                const imgEl = popupNode.querySelector('.fetch-img');
                const lblEl = popupNode.querySelector('.status-label');
                
                const cleanHex = hex.replace('~', '').trim().toLowerCase();
                const reg = ac.r ? ac.r.trim().toLowerCase() : null;

                const loadFallback = (msg) => {
                    if(lblEl) {
                        lblEl.innerText = msg;
                        lblEl.style.color = '#ffcc00';
                    }
                    imgEl.src = isHeli ? 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Helicopter_silhouette.svg/512px-Helicopter_silhouette.svg.png' : 'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a1/Airliner_silhouette_black.svg/512px-Airliner_silhouette_black.svg.png';
                    imgEl.style.filter = 'invert(1) opacity(0.2) drop-shadow(0 0 5px #00ffcc)'; 
                    imgEl.style.objectFit = 'contain';
                    imgEl.style.padding = '20px';
                    imgEl.onload = () => { imgEl.style.opacity = 1; };
                };

                if (imgEl.dataset.loaded === 'true') return;

                const apiUrl = reg ? `https://api.planespotters.net/pub/photos/reg/${reg}` : `https://api.planespotters.net/pub/photos/hex/${cleanHex}`;

                fetch(apiUrl)
                    .then(r => r.json())
                    .then(d => {
                        imgEl.dataset.loaded = 'true';
                        if (d.photos && d.photos.length > 0) {
                            imgEl.style.filter = 'none'; 
                            imgEl.style.objectFit = 'cover';
                            imgEl.style.padding = '0';
                            imgEl.src = d.photos[0].thumbnail_large.src;
                            imgEl.onload = () => {
                                imgEl.style.opacity = 1;
                                if(lblEl) lblEl.style.display = 'none';
                            };
                            imgEl.onerror = () => loadFallback('IMAGE BLOCKED BY BROWSER');
                        } else {
                            loadFallback('NOT FOUND IN DATABASE');
                        }
                    })
                    .catch(() => {
                        imgEl.dataset.loaded = 'true';
                        loadFallback('UPLINK BLOCKED');
                    });
            });

            marker.addTo(flightLayers);
        });

        if(intelLabel) intelLabel.innerText = `INTEL: ${renderedCount} TARGETS IN AREA RANGE`;

    } catch (e) { 
        console.error("Tactical Uplink Error: ", e); 
        if(intelLabel) intelLabel.innerText = "INTEL: UPLINK TIMEOUT. RETRYING...";
    } finally { 
        isUpdating = false; 
        if(scanBtn) scanBtn.innerText = "SCAN AREA";
    }
}

window.onload = () => { setTimeout(initMap, 500); };
</script>
</body>
</html>
